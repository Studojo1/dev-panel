name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The newest push wins; two deploys never race.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# Same as the other services: GitHub OIDC to Azure, no stored client secret.
# The repo secrets AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
# name the github-actions-studojo-dev-panel app registration, whose federated
# credential trusts repo:Studojo1/dev-panel:ref:refs/heads/main and which holds
# AcrPush on acrstudojo and the AKS Cluster User role on studojo-aks. The old
# docker/login-action step used AZURE_CLIENT_SECRET, which this repo never had,
# so every run failed at "Login to Azure Container Registry".
permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrstudojo-dhfsdrfhf6a6bbg2.azurecr.io
  ACR_NAME: acrstudojo
  APP_NAME: dev-panel
  IMAGE_TAG: ${{ github.sha }}
  AKS_RESOURCE_GROUP: rg-studojo
  AKS_CLUSTER_NAME: studojo-aks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          docker login ${{ env.REGISTRY }} -u 00000000-0000-0000-0000-000000000000 --password-stdin <<< "$TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy to Kubernetes
        run: |
          # Start the new pod before stopping the old one (single replica).
          kubectl patch deployment/${{ env.APP_NAME }} -n studojo \
            -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'
          kubectl set image deployment/${{ env.APP_NAME }} ${{ env.APP_NAME }}=${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} -n studojo
          kubectl rollout status deployment/${{ env.APP_NAME }} -n studojo --timeout=5m || {
            kubectl get pods -n studojo -l app=${{ env.APP_NAME }} -o wide
            POD=$(kubectl get pods -n studojo -l app=${{ env.APP_NAME }} --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || true)
            [ -n "$POD" ] && kubectl logs -n studojo "$POD" --tail=50 || true
            exit 1
          }

      - name: Record deployment
        env:
          DEPLOYMENT_SECRET: ${{ secrets.DEPLOYMENT_SECRET }}
        run: |
          curl -fsS -X POST https://api.studojo.com/v1/dev/deployments \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Secret: $DEPLOYMENT_SECRET" \
            -d '{
              "service": "${{ env.APP_NAME }}",
              "version": "${{ env.IMAGE_TAG }}",
              "deployed_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "deployed_by": "${{ github.actor }}",
              "status": "success",
              "workflow_run": ${{ github.run_id }}
            }' || echo "Failed to record deployment (non-critical)"
